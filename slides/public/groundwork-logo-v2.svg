<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g transform="translate(15, 10)">
    <!-- Gear ring -->
    <circle cx="70" cy="70" r="38" fill="none" stroke="#3ecf8e" stroke-width="9"/>

    <!-- Gear teeth -->
    <g fill="#3ecf8e">
      <g transform="rotate(0 70 70)"><rect x="63" y="16" width="14" height="16" rx="2"/></g>
      <g transform="rotate(45 70 70)"><rect x="63" y="16" width="14" height="16" rx="2"/></g>
      <g transform="rotate(90 70 70)"><rect x="63" y="16" width="14" height="16" rx="2"/></g>
      <g transform="rotate(135 70 70)"><rect x="63" y="16" width="14" height="16" rx="2"/></g>
      <g transform="rotate(180 70 70)"><rect x="63" y="16" width="14" height="16" rx="2"/></g>
      <g transform="rotate(225 70 70)"><rect x="63" y="16" width="14" height="16" rx="2"/></g>
      <g transform="rotate(270 70 70)"><rect x="63" y="16" width="14" height="16" rx="2"/></g>
      <g transform="rotate(315 70 70)"><rect x="63" y="16" width="14" height="16" rx="2"/></g>
    </g>

    <!-- Damped vibration waveform -->
    <polyline points="38,70 47,46 56,88 65,52 74,78 83,66 92,72 101,69 108,70"
      fill="none" stroke="#0f2318" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="38,70 47,46 56,88 65,52 74,78 83,66 92,72 101,69 108,70"
      fill="none" stroke="#eafff3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="175" y="100" font-family="Arial, 'Helvetica Neue', sans-serif" font-weight="900" font-size="64" letter-spacing="-1" fill="#e8f5ee">Groundwork</text>
</svg>
