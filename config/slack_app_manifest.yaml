# Paste into https://api.slack.com/apps -> Create New App -> From a manifest.
# Socket Mode: the GB10 connects out to Slack; no public URL or open port needed.
display_information:
  name: Dispatch Guardian
  description: Always-on dispatch monitoring with human-approved recovery plans (runs locally on the GB10).
  background_color: "#0b0f15"
features:
  bot_user:
    display_name: Dispatch Guardian
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:read
      - groups:read
      - app_mentions:read
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
