display_information:
  name: Dispatch Guardian
  description: Pre-dispatch safety gate and incident approvals
features:
  bot_user:
    display_name: dispatch-guardian
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - app_mentions:read
      - channels:history
      - im:history
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
